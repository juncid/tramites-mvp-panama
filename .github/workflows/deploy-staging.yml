name: Deploy to Staging (EKS)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
  EKS_CLUSTER_NAME: tramites-staging
  KUSTOMIZE_VERSION: '5.3.0'

jobs:
  # ============================================
  # Build and Push to ECR
  # ============================================
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    outputs:
      backend_image: ${{ steps.build-backend.outputs.image }}
      frontend_image: ${{ steps.build-frontend.outputs.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        id: build-backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/tramites-backend:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/tramites-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        id: build-frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/tramites-frontend:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/tramites-frontend:latest
          build-args: |
            VITE_API_URL=/api/v1
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output image tags
        run: |
          echo "backend_image=${{ env.ECR_REGISTRY }}/tramites-backend:${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "frontend_image=${{ env.ECR_REGISTRY }}/tramites-frontend:${{ github.sha }}" >> $GITHUB_OUTPUT

  # ============================================
  # Deploy to EKS
  # ============================================
  deploy:
    name: Deploy to EKS Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Install Kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash -s -- ${{ env.KUSTOMIZE_VERSION }}
          sudo mv kustomize /usr/local/bin/

      - name: Update image tags in kustomization
        working-directory: k8s/overlays/staging
        run: |
          kustomize edit set image \
            tramites-backend=${{ env.ECR_REGISTRY }}/tramites-backend:${{ github.sha }} \
            tramites-frontend=${{ env.ECR_REGISTRY }}/tramites-frontend:${{ github.sha }}

      - name: Deploy to Kubernetes
        run: |
          kustomize build k8s/overlays/staging | kubectl apply -f -

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/backend -n tramites-staging --timeout=300s
          kubectl rollout status deployment/frontend -n tramites-staging --timeout=300s
          kubectl rollout status deployment/celery-worker -n tramites-staging --timeout=300s

      - name: Get deployment info
        run: |
          echo "=== Deployment Status ==="
          kubectl get pods -n tramites-staging
          echo ""
          echo "=== Services ==="
          kubectl get svc -n tramites-staging
          echo ""
          echo "=== Access URLs ==="
          NODE_IP=$(kubectl get nodes -o jsonpath='{.items[0].status.addresses[?(@.type=="ExternalIP")].address}')
          echo "Frontend: http://${NODE_IP}:30080"
          echo "Backend API: http://${NODE_IP}:30800/api/v1"
          echo "Flower: http://${NODE_IP}:30555"

  # ============================================
  # Run Database Migrations
  # ============================================
  migrate:
    name: Run Migrations
    runs-on: ubuntu-latest
    needs: deploy
    environment: staging

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Run Alembic migrations
        run: |
          kubectl exec -n tramites-staging deployment/backend -- alembic upgrade head

  # ============================================
  # Smoke Tests
  # ============================================
  smoke-test:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: migrate
    environment: staging

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Get Node IP
        id: get-node-ip
        run: |
          NODE_IP=$(kubectl get nodes -o jsonpath='{.items[0].status.addresses[?(@.type=="ExternalIP")].address}')
          echo "node_ip=${NODE_IP}" >> $GITHUB_OUTPUT

      - name: Test Backend Health
        run: |
          for i in {1..10}; do
            if curl -sf http://${{ steps.get-node-ip.outputs.node_ip }}:30800/health; then
              echo "Backend is healthy!"
              exit 0
            fi
            echo "Attempt $i failed, retrying..."
            sleep 10
          done
          echo "Backend health check failed"
          exit 1

      - name: Test Frontend
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://${{ steps.get-node-ip.outputs.node_ip }}:30080)
          if [ "$HTTP_CODE" == "200" ]; then
            echo "Frontend is accessible!"
          else
            echo "Frontend returned HTTP $HTTP_CODE"
            exit 1
          fi

      - name: Deployment Summary
        run: |
          echo "## 🚀 Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Access URLs" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend**: http://${{ steps.get-node-ip.outputs.node_ip }}:30080" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend API**: http://${{ steps.get-node-ip.outputs.node_ip }}:30800/api/v1" >> $GITHUB_STEP_SUMMARY
          echo "- **Flower (Celery)**: http://${{ steps.get-node-ip.outputs.node_ip }}:30555" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Image Tags" >> $GITHUB_STEP_SUMMARY
          echo "- Backend: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
