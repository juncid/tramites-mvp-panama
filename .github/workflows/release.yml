name: Release for On-Premise

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        type: string

env:
  HARBOR_REGISTRY: ${{ secrets.HARBOR_REGISTRY }}
  HARBOR_PROJECT: tramites

jobs:
  # ============================================
  # Build and Push to Harbor
  # ============================================
  build-for-onpremise:
    name: Build for On-Premise
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            VERSION=${{ github.event.release.tag_name }}
          else
            VERSION=${{ inputs.version }}
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building version: ${VERSION}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          tags: |
            ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/backend:${{ steps.version.outputs.version }}
            ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/backend:latest
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/frontend:${{ steps.version.outputs.version }}
            ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/frontend:latest
          build-args: |
            VITE_API_URL=/api/v1
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create deployment package
        run: |
          mkdir -p release-package
          
          # Copy k8s manifests
          cp -r k8s release-package/
          
          # Copy scripts
          cp -r scripts/k8s release-package/scripts
          
          # Create version file
          echo "${{ steps.version.outputs.version }}" > release-package/VERSION
          
          # Create install script
          cat > release-package/install.sh << 'EOF'
          #!/bin/bash
          set -e
          
          VERSION=$(cat VERSION)
          REGISTRY="${HARBOR_REGISTRY:-harbor.local}"
          
          echo "Installing Tramites MVP Panama ${VERSION}"
          echo "Using registry: ${REGISTRY}"
          
          # Update image references
          cd k8s/overlays/onpremise
          kustomize edit set image \
            tramites-backend=${REGISTRY}/tramites/backend:${VERSION} \
            tramites-frontend=${REGISTRY}/tramites/frontend:${VERSION}
          
          # Apply manifests
          kustomize build . | kubectl apply -f -
          
          echo "Installation complete!"
          EOF
          chmod +x release-package/install.sh
          
          # Create tarball
          tar -czvf tramites-${{ steps.version.outputs.version }}-onpremise.tar.gz release-package/

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: onpremise-package-${{ steps.version.outputs.version }}
          path: tramites-${{ steps.version.outputs.version }}-onpremise.tar.gz

      - name: Attach to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: tramites-${{ steps.version.outputs.version }}-onpremise.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================
  # Generate Release Notes
  # ============================================
  release-notes:
    name: Generate Release Notes
    runs-on: ubuntu-latest
    needs: build-for-onpremise

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            VERSION=${{ github.event.release.tag_name }}
          else
            VERSION=${{ inputs.version }}
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Generate changelog
        run: |
          echo "## Release ${{ steps.version.outputs.version }}" > RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "### Docker Images" >> RELEASE_NOTES.md
          echo "- \`${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/backend:${{ steps.version.outputs.version }}\`" >> RELEASE_NOTES.md
          echo "- \`${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/frontend:${{ steps.version.outputs.version }}\`" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "### Installation" >> RELEASE_NOTES.md
          echo "1. Download the release package" >> RELEASE_NOTES.md
          echo "2. Extract: \`tar -xzvf tramites-${{ steps.version.outputs.version }}-onpremise.tar.gz\`" >> RELEASE_NOTES.md
          echo "3. Configure: Update \`k8s/overlays/onpremise/kustomization.yaml\`" >> RELEASE_NOTES.md
          echo "4. Install: \`./install.sh\`" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "### Commits since last release" >> RELEASE_NOTES.md
          git log --oneline --since="1 month ago" | head -20 >> RELEASE_NOTES.md || true

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: RELEASE_NOTES.md
