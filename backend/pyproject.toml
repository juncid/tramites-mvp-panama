[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Ignore specific rules that are acceptable in this project
ignore = [
    "F403",  # `from X import *` used - acceptable for __init__.py re-exports
    "F405",  # Name may be undefined from star import
    "E712",  # Comparison to True/False - required for SQLAlchemy filters
    "E402",  # Module level import not at top - sometimes needed for conditional imports
    "E722",  # Bare except - will fix later but not blocking
    "E501",  # Line too long - not critical for functionality
    "F841",  # Local variable assigned but never used - cleanup later
    "W293",  # Blank line contains whitespace - cosmetic only
    "W291",  # Trailing whitespace - cosmetic only
]
select = ["E", "F", "W"]

[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
