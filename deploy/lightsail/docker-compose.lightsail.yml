# Docker Compose para AWS Lightsail - MVP (4GB RAM + Swap)
# Optimizado para demo con pocos usuarios

services:
  # MS SQL Server Database (limitado a 1.5GB RAM)
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: tramites-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${SQL_PASSWORD:-YourStrong@Passw0rd}
      - MSSQL_PID=Developer
      - MSSQL_COLLATION=Modern_Spanish_CI_AS
      - MSSQL_MEMORY_LIMIT_MB=1536
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - tramites-network
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "${SQL_PASSWORD:-YourStrong@Passw0rd}" -Q "SELECT 1" -C -b -o /dev/null || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis Cache (mínimo necesario)
  redis:
    image: redis:7-alpine
    container_name: tramites-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - tramites-network
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          memory: 192M
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # FastAPI Backend
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile.prod
    container_name: tramites-backend
    environment:
      - DATABASE_HOST=sqlserver
      - DATABASE_PORT=1433
      - DATABASE_NAME=${DATABASE_NAME:-SIM_PANAMA}
      - DATABASE_USER=sa
      - DATABASE_PASSWORD=${SQL_PASSWORD:-YourStrong@Passw0rd}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - LOG_LEVEL=INFO
      - ENVIRONMENT=production
      - UPLOADS_DIR=/app/uploads
      - MAX_UPLOAD_SIZE_MB=50
      - IMAGE_MAX_DIMENSION=3000
      - OCR_TIMEOUT_SECONDS=120
    # Puerto solo accesible internamente (a través del proxy Nginx)
    expose:
      - "8000"
    volumes:
      - backend-logs:/app/logs
      - uploads-data:/app/uploads
    networks:
      - tramites-network
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 256M
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Celery Worker para OCR (1 worker, concurrencia 2)
  celery-worker:
    build:
      context: ../../backend
      dockerfile: Dockerfile.prod
    container_name: tramites-celery-worker
    environment:
      - DATABASE_HOST=sqlserver
      - DATABASE_PORT=1433
      - DATABASE_NAME=${DATABASE_NAME:-SIM_PANAMA}
      - DATABASE_USER=sa
      - DATABASE_PASSWORD=${SQL_PASSWORD:-YourStrong@Passw0rd}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - C_FORCE_ROOT=true
      - LOG_LEVEL=INFO
      - UPLOADS_DIR=/app/uploads
      - OCR_TIMEOUT_SECONDS=120
    volumes:
      - backend-logs:/app/logs
      - uploads-data:/app/uploads
    networks:
      - tramites-network
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 256M
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      celery -A celery_app worker 
      --loglevel=info 
      --concurrency=2
      --queues=ocr_high_priority,ocr_default,ocr_low_priority
      --max-tasks-per-child=50
      --time-limit=300
      --soft-time-limit=240
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Celery Beat para tareas programadas
  celery-beat:
    build:
      context: ../../backend
      dockerfile: Dockerfile.prod
    container_name: tramites-celery-beat
    environment:
      - DATABASE_HOST=sqlserver
      - DATABASE_PORT=1433
      - DATABASE_NAME=${DATABASE_NAME:-SIM_PANAMA}
      - DATABASE_USER=sa
      - DATABASE_PASSWORD=${SQL_PASSWORD:-YourStrong@Passw0rd}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - C_FORCE_ROOT=true
    volumes:
      - backend-logs:/app/logs
    networks:
      - tramites-network
    deploy:
      resources:
        limits:
          memory: 192M
        reservations:
          memory: 64M
    depends_on:
      - redis
    command: celery -A celery_app beat --loglevel=info
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # React Frontend (Nginx serving static build)
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile.prod
      args:
        - VITE_API_BASE_URL=${API_URL:-http://localhost:8000/api/v1}
    container_name: tramites-frontend
    ports:
      - "80:80"
    networks:
      - tramites-network
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M
    depends_on:
      - backend
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

networks:
  tramites-network:
    driver: bridge
    name: tramites-network

volumes:
  sqlserver-data:
    name: tramites-sqlserver-data
  redis-data:
    name: tramites-redis-data
  backend-logs:
    name: tramites-backend-logs
  uploads-data:
    name: tramites-uploads-data
