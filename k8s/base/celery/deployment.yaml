apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  namespace: tramites-staging
  labels:
    app: celery-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: celery-worker
  template:
    metadata:
      labels:
        app: celery-worker
    spec:
      containers:
        - name: celery-worker
          image: tramites-backend:latest
          command:
            - celery
            - -A
            - celery_app
            - worker
            - --loglevel=info
            - --concurrency=2
            - -Q
            - high_priority,default,low_priority
          envFrom:
            - configMapRef:
                name: tramites-config
          env:
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: tramites-secrets
                  key: DATABASE_USER
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tramites-secrets
                  key: DATABASE_PASSWORD
            - name: C_FORCE_ROOT
              value: "true"
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
          livenessProbe:
            exec:
              command:
                - celery
                - -A
                - celery_app
                - inspect
                - ping
                - -d
                - celery@$HOSTNAME
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 30
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - "celery -A celery_app control shutdown"
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: uploads-data
      terminationGracePeriodSeconds: 120
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-beat
  namespace: tramites-staging
  labels:
    app: celery-beat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery-beat
  template:
    metadata:
      labels:
        app: celery-beat
    spec:
      containers:
        - name: celery-beat
          image: tramites-backend:latest
          command:
            - celery
            - -A
            - celery_app
            - beat
            - --loglevel=info
          envFrom:
            - configMapRef:
                name: tramites-config
          env:
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: tramites-secrets
                  key: DATABASE_USER
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tramites-secrets
                  key: DATABASE_PASSWORD
            - name: C_FORCE_ROOT
              value: "true"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
      terminationGracePeriodSeconds: 30
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flower
  namespace: tramites-staging
  labels:
    app: flower
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flower
  template:
    metadata:
      labels:
        app: flower
    spec:
      containers:
        - name: flower
          image: tramites-backend:latest
          command:
            - celery
            - -A
            - celery_app
            - flower
            - --port=5555
          ports:
            - containerPort: 5555
          envFrom:
            - configMapRef:
                name: tramites-config
          env:
            - name: C_FORCE_ROOT
              value: "true"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 5555
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 5555
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: flower
  namespace: tramites-staging
spec:
  type: ClusterIP
  ports:
    - port: 5555
      targetPort: 5555
  selector:
    app: flower
