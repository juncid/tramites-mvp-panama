apiVersion: v1
kind: ConfigMap
metadata:
  name: tramites-config
  namespace: tramites-staging
data:
  # Database
  DATABASE_HOST: "sqlserver"
  DATABASE_PORT: "1433"
  DATABASE_NAME: "SIM_PANAMA"
  
  # Redis
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  
  # Celery
  CELERY_BROKER_URL: "redis://redis:6379/1"
  CELERY_RESULT_BACKEND: "redis://redis:6379/2"
  
  # Application
  ENVIRONMENT: "staging"
  LOG_LEVEL: "INFO"
  UPLOADS_DIR: "/app/uploads"
  MAX_UPLOAD_SIZE_MB: "100"
  OCR_TIMEOUT_SECONDS: "60"
  
  # Frontend (injected at build time)
  VITE_API_URL: "/api/v1"
