# Template for SealedSecret
# To create a sealed secret:
# 1. Create a regular secret YAML
# 2. Install kubeseal: brew install kubeseal
# 3. Seal it: kubeseal --format yaml < secret.yaml > sealedsecret.yaml
#
# Example secret to seal:
# ---
# apiVersion: v1
# kind: Secret
# metadata:
#   name: tramites-secrets
#   namespace: tramites-staging
# type: Opaque
# stringData:
#   DATABASE_USER: "sa"
#   DATABASE_PASSWORD: "YourStrong@Passw0rd"
#   SA_PASSWORD: "YourStrong@Passw0rd"
#   REDIS_PASSWORD: ""
#
# For development/testing, use this regular secret:
---
apiVersion: v1
kind: Secret
metadata:
  name: tramites-secrets
  namespace: tramites-staging
type: Opaque
stringData:
  DATABASE_USER: "sa"
  DATABASE_PASSWORD: "YourStrong@Passw0rd123"
  SA_PASSWORD: "YourStrong@Passw0rd123"
  REDIS_PASSWORD: ""
