apiVersion: batch/v1
kind: CronJob
metadata:
  name: sqlserver-backup
  namespace: tramites-staging
spec:
  schedule: "0 2 * * *"  # Daily at 2:00 AM
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: backup
              image: mcr.microsoft.com/mssql/server:2022-latest
              command:
                - /bin/bash
                - -c
                - |
                  set -e
                  
                  BACKUP_DIR="/var/opt/mssql/backup"
                  TIMESTAMP=$(date +%Y%m%d_%H%M%S)
                  BACKUP_FILE="${BACKUP_DIR}/SIM_PANAMA_${TIMESTAMP}.bak"
                  
                  echo "Starting backup at $(date)"
                  
                  # Create backup
                  /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "${SA_PASSWORD}" -C -Q "
                    BACKUP DATABASE [SIM_PANAMA] 
                    TO DISK = '${BACKUP_FILE}'
                    WITH FORMAT, COMPRESSION, STATS = 10;
                  "
                  
                  echo "Backup created: ${BACKUP_FILE}"
                  
                  # List backups
                  ls -la ${BACKUP_DIR}/*.bak 2>/dev/null || echo "No backups found"
                  
                  # Delete backups older than 7 days
                  echo "Cleaning old backups..."
                  find ${BACKUP_DIR} -name "*.bak" -mtime +7 -delete
                  
                  echo "Remaining backups:"
                  ls -la ${BACKUP_DIR}/*.bak 2>/dev/null || echo "No backups found"
                  
                  echo "Backup completed at $(date)"
              env:
                - name: SA_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: tramites-secrets
                      key: SA_PASSWORD
              volumeMounts:
                - name: sqlserver-backup
                  mountPath: /var/opt/mssql/backup
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "100m"
                limits:
                  memory: "512Mi"
                  cpu: "500m"
          restartPolicy: OnFailure
          volumes:
            - name: sqlserver-backup
              persistentVolumeClaim:
                claimName: sqlserver-backup
