# Sealed Secrets Controller
# For encrypting secrets in Git
---
# To install Sealed Secrets:
# kubectl apply -f https://github.com/bitnami-labs/sealed-secrets/releases/download/v0.24.5/controller.yaml
#
# Install kubeseal CLI:
# brew install kubeseal  # macOS
# # or download from: https://github.com/bitnami-labs/sealed-secrets/releases
#
# Usage:
# 1. Create a regular secret:
#    kubectl create secret generic my-secret --dry-run=client -o yaml > secret.yaml
#
# 2. Seal it:
#    kubeseal --format yaml < secret.yaml > sealedsecret.yaml
#
# 3. Apply the sealed secret:
#    kubectl apply -f sealedsecret.yaml
#
# Note: Sealed secrets are cluster-specific. You need to seal secrets
# for each cluster separately.
