apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tramites-panama

resources:
  - ../../base

# Patches específicos para EKS
patchesStrategicMerge:
  - backend-patch.yaml
  - frontend-patch.yaml

# Configuración de imágenes - actualiza con tu ECR
images:
  - name: backend
    newName: <AWS_ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/tramites-backend
    newTag: latest
  - name: frontend
    newName: <AWS_ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/tramites-frontend
    newTag: latest

# ConfigMap para EKS
configMapGenerator:
  - name: app-config
    behavior: merge
    literals:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
