apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tramites-staging

resources:
  - ../../base
  - ingress.yaml
  - nfs-storageclass.yaml

images:
  - name: tramites-backend
    newName: harbor.local/tramites/backend
    newTag: latest
  - name: tramites-frontend
    newName: harbor.local/tramites/frontend
    newTag: latest

labels:
  - pairs:
      app.kubernetes.io/environment: production
    includeSelectors: true

patches:
  - target:
      kind: PersistentVolumeClaim
    patch: |-
      - op: add
        path: /spec/storageClassName
        value: nfs-client

  # Increase replicas for production
  - target:
      kind: Deployment
      name: backend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3

  - target:
      kind: Deployment
      name: frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3

  # Adjust HPA for production
  - target:
      kind: HorizontalPodAutoscaler
      name: celery-worker-hpa
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 10

  # Override environment settings for production
  - target:
      kind: ConfigMap
      name: tramites-config
    patch: |-
      - op: replace
        path: /data/ENVIRONMENT
        value: production
      - op: replace
        path: /data/LOG_LEVEL
        value: WARNING
